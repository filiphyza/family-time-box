name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall downloads and hash-checks the face/scene model files
      - run: npm ci
      # No Gemini key on purpose: anything in the bundle is readable by every visitor.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Firebase web config (repository variable). It is not a secret: the
          # Firestore/Storage rules allow only the family allowlist to see data.
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
